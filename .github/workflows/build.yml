name: Build Eastward Native Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      game:
        description: 'Base game title ID'
        required: false
        default: '010071B00F63A000'
      api:
        description: 'Android min/native API level (29 = Android 10)'
        required: false
        default: '29'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      GAME: ${{ inputs.game || '010071B00F63A000' }}
      API: ${{ inputs.api || '29' }}
      WORK: ${{ runner.temp }}/eastward-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates python3 python3-venv \
            gcc g++ make cmake ninja-build unzip

      - name: Cache NDK, .NET, Android SDK, CPython & sources
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/eastward-build/android-ndk-r27c
            ${{ runner.temp }}/eastward-build/dotnet
            ${{ runner.temp }}/eastward-build/android-sdk
            ${{ runner.temp }}/eastward-build/python-android
            ${{ runner.temp }}/eastward-build/capstone-5.0.7
            ${{ runner.temp }}/eastward-build/lz4-1.10.0
            ${{ runner.temp }}/eastward-build/capstone-py
            ${{ runner.temp }}/eastward-build/libadrenotools
            dm/android/spirv_cross/src
          key: toolchain-${{ runner.os }}-r27c-dotnet10-api${{ env.API }}-py3149

      - name: Build Android APK
        run: |
          set -euo pipefail
          sed -i 's/\r$//' scripts/build_apk_pc.sh \
            dm/android/extract_aot/build_extract_aot.sh \
            dm/android/xlate_aot/build_xlate_aot.sh \
            dm/android/spirv_cross/build_spirv_cross.sh
          GAME="$GAME" API="$API" bash scripts/build_apk_pc.sh
          ls -lh "$WORK"/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EastwardNative-API${{ env.API }}-arm64
          path: ${{ runner.temp }}/eastward-build/*.apk
          if-no-files-found: error
          retention-days: 30
